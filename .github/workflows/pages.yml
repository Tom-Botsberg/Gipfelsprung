name: Publish game to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static game
        run: |
          mkdir -p _site/js
          sed 's/name="gipfelsprung-mode" content="local"/name="gipfelsprung-mode" content="static"/' index.html > _site/index.html
          cp styles.css _site/
          cp js/logic.js js/art.js js/game.js _site/js/
          touch _site/.nojekyll
      - name: Upload static game only
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
